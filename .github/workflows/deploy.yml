name: Deploy AHK Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/engine-manager.js
          node --check assets/js/sql-engine.js
      - name: Validate published curriculum
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); const i=JSON.parse(fs.readFileSync('curriculum/index.json','utf8')); const p=Number(m.release_control.published_through_day); if(i.published_through_day!==p) throw new Error('Manifest/index published-day mismatch'); for(const d of i.open_days){const f='curriculum/day-'+String(d).padStart(3,'0')+'.json'; if(!fs.existsSync(f)) throw new Error('Missing '+f); JSON.parse(fs.readFileSync(f,'utf8'));} console.log('Curriculum validation passed through Day '+p);"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
