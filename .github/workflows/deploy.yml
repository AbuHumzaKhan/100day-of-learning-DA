name: Deploy AHK Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/engine-manager.js
          node --check assets/js/sql-engine.js

      - name: Validate curriculum release
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const index = JSON.parse(fs.readFileSync('curriculum/index.json','utf8'));
          const published = Number(manifest.release_control.published_through_day);
          if (index.published_through_day !== published) throw new Error('Manifest/index published-day mismatch');
          for (const day of index.open_days) {
            const file = 'curriculum/day-' + String(day).padStart(3,'0') + '.json';
            if (!fs.existsSync(file)) throw new Error('Missing ' + file);
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            if (!Array.isArray(data.topics) || data.topics.length !== 5) throw new Error(file + ' must contain exactly 5 topics');
            const questions = data.topics.reduce((n,t) => n + (Array.isArray(t.questions) ? t.questions.length : 0), 0);
            if (questions !== 15) throw new Error(file + ' must contain exactly 15 questions');
          }
          console.log('Curriculum validation passed through Day ' + published);
          NODE

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
