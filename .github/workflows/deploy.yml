name: AHK Academy Quality Gate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-package-lock

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/core/storage.js
          node --check engines/sql-engine.js
          node --check scripts/validate-content.mjs
          node --check playwright.config.mjs

      - name: Validate curriculum, datasets and release contract
        run: npm run validate:content

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
